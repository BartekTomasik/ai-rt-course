[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rtcourse"
version = "0.1.0"
description = "Educational helpers for the course 'AI w radioterapii' (not for clinical use)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "scikit-image", "scikit-learn", "pydicom>=2.4"]

[tool.setuptools]
packages = ["rtcourse"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
